# Runs the app next to the exercise's own docker-compose (mocks, InfluxDB, Grafana, k6), which stays untouched.
# Start the mocks first from the exercise folder: docker-compose up -d simulado influxdb grafana
services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      # The mock publishes port 3001 on the host; k6 reaches this app the same way, through host.docker.internal
      PRODUCT_API_BASE_URL: http://host.docker.internal:3001
    extra_hosts:
      - "host.docker.internal:host-gateway"
