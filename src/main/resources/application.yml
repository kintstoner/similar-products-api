server:
  port: 5000

spring:
  application:
    name: similar-products-api
  threads:
    virtual:
      # Each request blocked on downstream I/O parks a virtual thread instead of an OS thread
      enabled: true
  cache:
    cache-names: productDetails, similarIds
    # Short TTL bounds staleness of price and availability; the size cap bounds memory
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=5m

product-api:
  base-url: http://localhost:3001
  connect-timeout: 1s
  # Product decision: a similar-products widget must not hold the product page; fewer results fast beat all results late
  read-timeout: 3s

similar-products:
  # Safety net on top of the HTTP read timeout, which is what really bounds each detail lookup
  lookup-timeout: 4s

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 100
        minimum-number-of-calls: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 5
        # A missing product is a valid answer, not a sign that the product API is unhealthy
        ignore-exceptions:
          - com.example.similarproducts.domain.ProductNotFoundException
    instances:
      productSimilarIds:
        base-config: default
      productDetail:
        base-config: default
